services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autouploader
      POSTGRES_USER: autouploader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autouploader -d autouploader"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - path: apps/server/.env.example
      - path: apps/server/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://autouploader:${POSTGRES_PASSWORD}@postgres:5432/autouploader
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: 1gb
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: autouploader
      PGUSER: autouploader
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ./apps/server/scripts/backup.sh:/backup.sh:ro
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  backup-sync:
    image: minio/mc:latest
    restart: unless-stopped
    env_file:
      - path: apps/server/.env.example
      - path: apps/server/.env
        required: false
    volumes:
      - postgres-backups:/backups:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        while true; do
          mc alias set r2 "$$R2_ENDPOINT" "$$R2_ACCESS_KEY_ID" "$$R2_SECRET_ACCESS_KEY" --api S3v4 &&
          mc mirror --overwrite /backups "r2/$$R2_BUCKET/database-backups";
          sleep 3600;
        done
    depends_on:
      - backup

volumes:
  postgres-data:
  postgres-backups:
  caddy-data:
  caddy-config:
