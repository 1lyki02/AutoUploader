name: Build macOS client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare license config
        working-directory: apps/client
        env:
          SUPABASE_LICENSE_URL: ${{ secrets.SUPABASE_LICENSE_URL }}
          LICENSE_SIGNING_PUBLIC_JWK: ${{ secrets.LICENSE_SIGNING_PUBLIC_JWK }}
        run: |
          if [ -n "$SUPABASE_LICENSE_URL" ] && [ -n "$LICENSE_SIGNING_PUBLIC_JWK" ]; then
            node -e "
              const fs = require('fs');
              fs.writeFileSync('license.config.json', JSON.stringify({
                apiUrl: process.env.SUPABASE_LICENSE_URL.replace(/\/+$/, ''),
                publicJwk: JSON.parse(process.env.LICENSE_SIGNING_PUBLIC_JWK)
              }, null, 2));
            "
          else
            node scripts/ensure-license-config.mjs
          fi

      - name: Build unsigned macOS app
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @autouploader/client package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: road-macos
          path: |
            apps/client/release/*.dmg
            apps/client/release/*.zip

      - name: Build and publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter @autouploader/client publish:github:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
