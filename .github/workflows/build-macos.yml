name: Build macOS client

on:
  push:
    branches: [ci-build]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload ROAD.dmg + ROAD-mac.zip to GitHub Releases"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Remove stale orphan node_modules
        run: |
          rm -rf apps/admin/node_modules apps/server/node_modules apps/telegram-admin/node_modules

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare license config
        working-directory: apps/client
        env:
          SUPABASE_LICENSE_URL: ${{ secrets.SUPABASE_LICENSE_URL }}
          LICENSE_SIGNING_PUBLIC_JWK: ${{ secrets.LICENSE_SIGNING_PUBLIC_JWK }}
        run: |
          if [ -n "$SUPABASE_LICENSE_URL" ] && [ -n "$LICENSE_SIGNING_PUBLIC_JWK" ]; then
            node -e "
              const fs = require('fs');
              fs.writeFileSync('license.config.json', JSON.stringify({
                apiUrl: process.env.SUPABASE_LICENSE_URL.replace(/\/+$/, ''),
                publicJwk: JSON.parse(process.env.LICENSE_SIGNING_PUBLIC_JWK)
              }, null, 2));
            "
          elif [ -f license.config.ci.json ]; then
            cp license.config.ci.json license.config.json
            echo "Using license.config.ci.json"
          else
            node scripts/ensure-license-config.mjs
          fi

      - name: Cache Instagram worker bundle
        uses: actions/cache@v4
        id: ig-cache
        with:
          path: apps/client/build/instagram-worker
          key: ig-worker-${{ hashFiles('packages/automation/scripts/instagram-browser-worker.mjs', 'apps/client/package.json', 'pnpm-lock.yaml') }}

      - name: Prepare Instagram worker
        if: steps.ig-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3"
            if pnpm --filter @autouploader/client prepare:instagram-worker; then
              exit 0
            fi
            sleep 45
          done
          exit 1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build client
        run: pnpm --filter @autouploader/client build

      - name: Read package version
        id: pkg
        working-directory: apps/client
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Package version is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Verify build inputs
        run: |
          ls -la packages/automation/vendor/
          test -f packages/automation/vendor/ffmpeg
          test -f apps/client/build/icon.png

      - name: Package macOS app
        working-directory: apps/client
        timeout-minutes: 60
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List release output
        run: |
          cd apps/client/release
          ls -la
          for zip in *.zip; do
            if [ "$zip" != "ROAD-mac.zip" ]; then
              mv "$zip" ROAD-mac.zip
            fi
          done
          ls -la

      - name: Upload macOS assets to GitHub Release
        if: github.ref == 'refs/heads/ci-build' || startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: ROAD ${{ steps.pkg.outputs.version }}
          files: |
            apps/client/release/ROAD.dmg
            apps/client/release/ROAD-mac.zip
            apps/client/release/latest-mac.yml
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unsigned macOS app (artifacts only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        run: pnpm --filter @autouploader/client package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: road-macos
          path: |
            apps/client/release/ROAD.dmg
            apps/client/release/ROAD-mac.zip
