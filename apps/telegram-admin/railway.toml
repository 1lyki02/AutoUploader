# Railway: set Root Directory to repo root, Dockerfile path apps/telegram-admin/Dockerfile
# Or deploy with: railway up (from repo root using this config via railway.toml at root — see docs)

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/telegram-admin/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
