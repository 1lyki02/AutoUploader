# Deploy telegram-admin Mini App + bot.
# Railway project settings can also point Dockerfile to apps/telegram-admin/Dockerfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/telegram-admin/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
